[project]
name = "mandelbrot-tooling"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mpmath>=1.3",
    "jsonschema>=4.23",
    "pyarrow>=25.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "research/tests", "reporting/tests"]
pythonpath = ["ingestion", "research", "reporting"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["build", "vcpkg_installed"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "python_pure/src"

[[tool.mypy.overrides]]
module = ["mpmath.*", "jsonschema.*", "pyarrow.*"]
ignore_missing_imports = true
