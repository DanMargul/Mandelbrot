[tracks.python_pure]
command = ["uv", "run", "--no-sync", "--project", "python_pure", "volarb-py"]
built_when_present = "python_pure/pyproject.toml"

[tracks.python_cpp]
command = ["uv", "run", "--no-sync", "--project", "python_cpp", "volarb-cpp"]
built_when_present = "python_cpp/pyproject.toml"

[tracks.cpp_pure]
command = ["build/release/cpp_pure/volarb-native"]
built_when_present = "build/release/cpp_pure/volarb-native"

[verbs.read-chain-as-of]
input_schema = "chain_query/v1"
output_schema = "chain_snapshot/v1"

[verbs.imply-forward-curve]
input_schema = "chain_query/v1"
output_schema = "forward_curve/v1"

[verbs.price-options]
input_schema = "pricing_request/v1"
output_schema = "pricing_result/v1"

[verbs.invert-implied-volatility]
input_schema = "implied_volatility_request/v1"
output_schema = "implied_volatility_result/v1"
