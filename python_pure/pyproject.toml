[project]
name = "volarb-py"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
volarb-py = "volarb_py.cli:entry_point"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "mpmath>=1.3",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volarb_py"]
